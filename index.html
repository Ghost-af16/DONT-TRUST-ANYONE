<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DON'T TRUST ANYONE</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/home.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/rules.css">
  <script src="js/main.js" defer></script>
</head>
<body>
  <main>
    <section id="home-screen" class="screen home-screen" aria-label="Main menu">
      <div class="forest-scene" aria-hidden="true">
        <img class="forest-background" src="homepage-background.png" alt="" width="1600" height="900" draggable="false">
        <img class="hattori" src="ninja-hattori.png" alt="" width="564" height="875" draggable="false">
      </div>
      <nav class="home-menu" aria-label="Game menu">
        <button id="play-button" class="menu-button" type="button">PLAY</button>
        <button id="rules-button" class="menu-button" type="button">RULES</button>
      </nav>
    </section>

    <section id="game-screen" class="screen preview-screen" aria-label="Climb inside the well" tabindex="-1" hidden>
      <h1>Climb inside the well</h1>
      <button id="game-back-button" class="back-button" type="button">BACK TO HOME</button>
    </section>

    <section id="rules-screen" class="screen rules-screen" aria-labelledby="rules-heading" hidden>
      <div class="rules-paper">
        <div class="rules-paper-content">
          <h1 id="rules-heading">HOW TO ESCAPE</h1>
          <div class="rules-instructions">
            <p>Answer the questions correctly.</p>
            <p>Each correct answer takes you higher.</p>
            <p>One wrong answer sends you back down.</p>
          </div>
          <p class="rules-reminder">And remember...</p>
          <p class="rules-warning">DON'T TRUST ANYONE.</p>
          <button id="rules-back-button" class="back-button rules-back-button" type="button">BACK</button>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
